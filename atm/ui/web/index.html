<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Translator Manager</title>
    <link rel="stylesheet" href="styles.css?v=31">
    <!-- FOUC Prevention: apply theme before paint -->
    <script>
      (function(){
        document.documentElement.classList.add('fouc-guard');
        var accent = localStorage.getItem('atm_accent');
        if (accent) {
            document.documentElement.style.setProperty('--accent', accent);
            var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(accent);
            if (m) {
                document.documentElement.style.setProperty('--accent-rgb', parseInt(m[1], 16) + ', ' + parseInt(m[2], 16) + ', ' + parseInt(m[3], 16));
            }
        }
        
        /*__SERVER_DARK_MODE__*/
        var settings = {};
        try {
            settings = JSON.parse(localStorage.getItem('atm_settings') || '{}');
        } catch (e) {
            console.error("Local storage atm_settings is malformed", e);
        }
        var isDark = (typeof serverDarkMode !== 'undefined') ? serverDarkMode : (settings.dark_mode !== false);
        if (isDark) {
            document.documentElement.classList.add('theme-dark');
            document.documentElement.style.backgroundColor = '#0F172A'; // Dark mode bg
        } else {
            document.documentElement.classList.remove('theme-dark');
            document.documentElement.style.backgroundColor = '#F8F9FA'; // Light mode bg
        }
        
        window.onerror = function(msg, url, line, col, error) {
            var banner = document.getElementById('error-banner');
            if (banner) {
                banner.style.display = 'block';
                banner.textContent = 'JS Error: ' + msg + ' | ' + url + ':' + line + ':' + col;
            }
            fetch('/api/ping?client_id=ERR_' + encodeURIComponent(msg)).catch(function(){});
        };
        window.addEventListener('unhandledrejection', function(event) {
            var errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:orange;color:white;padding:10px;z-index:9999999;font-size:14px;white-space:pre-wrap;word-break:break-all;';
            errDiv.textContent = 'Promise Error: ' + (event.reason ? event.reason.toString() : 'Unknown');
            if (event.reason && event.reason.stack) errDiv.textContent += '\nStack: ' + event.reason.stack;
            if (document.body) document.body.appendChild(errDiv); else document.documentElement.appendChild(errDiv);
        });
      })();
    </script>
    <!-- Scripts loaded with defer (non-blocking, executed in order) -->
    <script src="/js/core/events.js?v=3" defer></script>
    <script src="/js/core/api.js?v=3" defer></script>
    <script src="/js/core/dom.js?v=3" defer></script>
    <script src="/js/core/i18n.js?v=3" defer></script>
    <script src="/js/core/navigation.js?v=3" defer></script>
    
    <!-- UI Components -->
    <script src="/js/ui/theme.js?v=3" defer></script>
    <script src="/js/ui/modals.js?v=3" defer></script>
    <script src="/js/toast.js?v=3" defer></script>
    
    <!-- Features -->
    <script src="/js/features/polling.js?v=3" defer></script>
    <script src="/js/features/games.js?v=3" defer></script>
    <script src="/js/features/workspace.js?v=3" defer></script>
    <script src="/js/features/editor.js?v=3" defer></script>
    <script src="/js/features/settings.js?v=3" defer></script>
    <script src="/js/features/data.js?v=3" defer></script>
    <script src="/js/features/glossary.js?v=3" defer></script>
    <script src="/js/features/tm.js?v=3" defer></script>
    
    <!-- App Entry -->
    <script src="/js/app.js?v=3" defer></script>
    <style>
      .fouc-guard body { visibility: hidden; }
    </style>
</head>
<body>
    <div id="error-banner" style="display:none; background:#ff4d4f; color:white; text-align:center; padding:8px; position:sticky; top:0; z-index:9999;"></div>
    <div id="offline-banner" data-i18n="app.offline" style="display:none; background:#ff4d4f; color:white; text-align:center; padding:8px; position:sticky; top:0; z-index:9999;"></div>
    <noscript>
        <div style="background: var(--danger-color, #ef4444); color: white; padding: 20px; text-align: center; font-size: 16px; font-weight: bold; position: fixed; top: 0; left: 0; width: 100%; z-index: 999999;">
            Auto Translator Manager requires JavaScript to run. Please enable JavaScript in your browser.
        </div>
    </noscript>
    <div id="confirm-modal" class="modal-overlay" style="display:none;z-index:10000;">
        <div class="modal-content">
            <h3 id="confirm-message"></h3>
            <div class="confirm-actions">
                <button id="confirm-no" class="btn-delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span data-i18n="confirm.no">Hủy</span>
                </button>
                <button id="confirm-yes" class="btn-success">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span data-i18n="confirm.yes">Đồng ý</span>
                </button>
            </div>
        </div>
    </div>
    <div id="save-confirm-modal" class="modal-overlay" style="display:none;z-index:10000;">
        <div class="modal-content" style="max-width: 500px; padding: 24px;">
            <h3 id="save-confirm-message" style="margin-bottom: 24px; line-height: 1.6; font-size: 16px;">Bạn có thay đổi chưa lưu. Bạn muốn làm gì?</h3>
            <div class="confirm-actions" style="display: flex; gap: 12px; width: 100%;">
                <button id="save-confirm-cancel" class="btn-secondary" style="flex: 1;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span data-i18n="common.cancel">Hủy (Ở lại)</span>
                </button>
                <button id="save-confirm-discard" class="btn-delete" style="flex: 1; padding: 10px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span data-i18n="editor.discard_leave">Không Lưu & Rời đi</span>
                </button>
                <button id="save-confirm-save" class="btn-success heartbeat-neon-green" style="flex: 1; padding: 10px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span data-i18n="editor.save_leave">Lưu & Rời đi</span>
                </button>
            </div>
        </div>
    </div>
    <div id="info-modal" class="modal-overlay" style="display:none;z-index:10000;">
        <div class="modal-content">
            <h3 id="info-title" style="margin-bottom: 12px; font-weight: 600;" data-i18n="common.info"></h3>
            <div id="info-message" style="margin-bottom: 20px; white-space: pre-wrap; font-size: 14px; color: var(--text-secondary); max-height: 400px; overflow-y: auto; text-align: left;"></div>
            <div class="confirm-actions" style="justify-content: flex-end;">
                <button id="info-ok" class="btn-accent" style="min-width: 120px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span data-i18n="confirm.ok">OK</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Prompt Modal -->
    <div id="prompt-modal" class="modal-overlay" style="display:none;z-index:10000;">
        <div class="modal-content">
            <h3 id="prompt-message" style="margin-bottom: 12px;"></h3>
            <input type="number" id="prompt-input" class="input-base themed-input" style="width: 100%; margin-bottom: 20px; padding: 10px; border-radius: var(--radius-md);" min="0">
            <div class="confirm-actions">
                <button id="prompt-no" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span data-i18n="confirm.no">Hủy</span>
                </button>
                <button id="prompt-yes" class="btn-success">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span data-i18n="confirm.ok">OK</span>
                </button>
            </div>
        </div>
    </div>

    <!--  Toast  -->
    <div id="toast" class="toast">
        <span id="toast-message"></span>
    </div>

    <!--  Goodbye Screen  -->
    <div id="goodbye-screen" class="goodbye-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg-base); z-index:99999; flex-direction:column; justify-content:center; align-items:center;">
        <div class="intro-logo-container">
            <svg class="intro-logo-svg" viewBox="0 0 24 24" fill="none">
                <polygon points="12 2 22 7 22 17 12 22 2 17 2 7"></polygon>
            </svg>
            <div class="intro-logo-text">ATM</div>
        </div>
        <h2 class="goodbye-title" data-i18n="goodbye.title" style="color:var(--text-primary); font-size: 24px; margin-bottom: 10px; font-weight:600;"></h2>
        <p class="goodbye-subtitle" data-i18n="goodbye.subtitle" style="color:var(--text-muted); font-size: 14px;"></p>
    </div>

    <!--  TEMPLATE: GAME CARD (Anti-XSS & Performance)  -->
    <template id="game-card-template">
        <div class="game-card" data-game-id="">
            <div class="game-header" style="cursor: pointer;" data-action="editor" title="Open Workspace">
                <div style="display: flex; gap: 12px; align-items: center; width: 100%;">
                    <div class="game-avatar" style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: white; flex-shrink: 0; text-transform: uppercase;"></div>
                    <div class="game-info" style="flex: 1; min-width: 0;">
                        <h3 class="game-name text-truncate" style="margin-bottom: 2px;"></h3>
                        <p class="game-path text-muted text-xs text-truncate"></p>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -6px;">
                <span class="engine-badge"></span>
                <span class="status-badge" style="font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase;"></span>
            </div>
            
            <div class="lang-row mt-sm mb-sm">
                <div class="lang-group">
                    <label data-i18n="card.engine">Engine Dịch</label>
                    <select class="lang-select engine-select"></select>
                </div>
                <div class="lang-group">
                    <label data-i18n="card.source_lang">Ngôn ngữ gốc</label>
                    <select class="lang-select source-select"></select>
                </div>
                <span class="lang-arrow" style="margin-top: 14px;"></span>
                <div class="lang-group">
                    <label data-i18n="card.target_lang">Dịch sang</label>
                    <select class="lang-select target-select"></select>
                </div>
            </div>

            <div class="progress-container hidden mb-sm" style="display:none;">
                <div class="progress-header flex-row justify-between text-xs font-semibold text-accent mb-xs" style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--accent);">
                    <span class="progress-status" data-i18n="card.translating">đang dịch</span>
                    <span class="progress-percent">0%</span>
                </div>
                <div class="progress-bar-track" style="width: 100%; height: 6px; background-color: var(--bg-hover); border-radius: 3px; overflow: hidden;">
                    <div class="progress-bar-fill" style="width: 0%; height: 100%; background-color: var(--accent); transition: width 0.3s ease;"></div>
                </div>
            </div>

            <div class="game-actions flex-row gap-sm mt-sm" style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn-start flex-1 btn-action-start" data-action="start" data-i18n="card.start">Bắt đầu dịch</button>
                <button class="btn-icon" data-action="editor" title="Workspace">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
                <button class="btn-delete" data-action="delete" title="Xóa Game">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>
    </template>
    
    <!--  TEMPLATE: WORKSPACE SHELL  -->
    <template id="workspace-shell-template">
        <div class="workspace-shell" style="padding: 20px; display:flex; flex-direction:column; height: 100%;">
            <div class="workspace-tabs" style="display:flex; justify-content:space-between; border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
                <div style="display:flex;">
                    <button class="tab-btn tab-editor active" data-i18n="workspace.tab_editor"></button>
                    <button class="tab-btn tab-glossary" data-i18n="workspace.tab_glossary"></button>
                    <button class="tab-btn tab-tm" data-i18n="workspace.tab_tm"></button>
                    <button class="tab-btn tab-audit hidden" style="display: none;" data-i18n="workspace.tab_audit"></button>
                    <button class="tab-btn tab-extract hidden" style="display: none;" data-i18n="workspace.tab_extract"></button>
                </div>
                <div style="display:flex; align-items:center; padding-right:10px;">
                    <button class="btn-refresh-workspace" data-i18n-title="workspace.sync_btn_title" title="Đồng bộ lại dữ liệu dịch" style="background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition: all 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="refresh-icon"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
                
                <div class="job-progress-container" style="display:none; padding: 12px 20px; align-items:center;">
                    <span class="job-progress-text" style="margin-right: 10px; font-size: 0.9em; color: var(--text-secondary);"></span>
                    <div style="width: 150px; height: 8px; background: var(--surface-200); border-radius: 4px; overflow: hidden;">
                        <div class="job-progress-bar" style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s ease;"></div>
                    </div>
                </div>
            </div>

            <!-- Always visible Workspace Progress Dock -->
            <div class="workspace-progress-dock" style="margin-bottom: 20px; display:flex; flex-direction:column; gap:6px;">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600;">
                    <span class="workspace-status-text" style="color:var(--text-secondary);" data-i18n="workspace.status_ready"></span>
                    <span class="workspace-percent-text" style="color:var(--text-secondary);">0%</span>
                </div>
                <div style="width: 100%; height: 6px; background: var(--bg-hover); border-radius: 3px; overflow: hidden;">
                    <div class="workspace-progress-bar" style="width: 0%; height: 100%; background: var(--text-muted); transition: width 0.3s ease, background-color 0.3s ease;"></div>
                </div>
                <!-- Refresh status text (Hidden by default) -->
                <div class="workspace-refresh-status" style="display:none; font-size:12px; font-weight:500; align-items:center; gap:6px; color:var(--accent);">
                    <svg class="spinner" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                    <span class="refresh-status-text" data-i18n="workspace.refreshing"></span>
                </div>
            </div>

            <div class="editor-workspace-mount" id="editor-workspace-mount" style="flex: 1; overflow: hidden; display:flex; flex-direction:column;">
                <!-- Editor mounts here -->
            </div>
        </div>
    </template>



    <script>
      window.addEventListener('DOMContentLoaded', function() {
          var lang = localStorage.getItem('atm_lang') || 'vi';
          if (window.ATM && window.ATM.i18n) {
              window.ATM.i18n.setLang(lang);
          }
          document.documentElement.classList.remove('fouc-guard');
      });
    </script>

    <!--  Hello Screen  -->
    <div id="hello-screen" class="hello-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg-base); z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="intro-logo-container">
            <svg class="intro-logo-svg" viewBox="0 0 24 24" fill="none">
                <polygon points="12 2 22 7 22 17 12 22 2 17 2 7"></polygon>
            </svg>
            <div class="intro-logo-text">ATM</div>
        </div>
        <h1 style="color:var(--text-primary); font-size:32px; font-weight:800; margin-bottom: 30px; letter-spacing: -0.5px;">ATM Translator</h1>
        <div style="width: 240px; height: 4px; background: var(--bg-card); border-radius: 2px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);">
            <div id="hello-loading-bar" style="width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear;"></div>
        </div>
        <p id="hello-loading-text" data-i18n="hello.loading" style="color:var(--text-muted); margin-top:16px; font-size:13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;"></p>
    </div>

    <div class="app-container">
        <!--  Sidebar  -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area" id="sidebar-brand" title="ATM Translator">
                    <div class="logo-icon">ATM</div>
                    <h2>Translator</h2>
                </div>
                <button class="sidebar-pin-btn" id="sidebar-pin-btn" data-i18n-title="sidebar.pin_tooltip" title="Ghim thanh bên">
                    <svg class="pin-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="17" x2="12" y2="22"></line>

            </div>

            <ul class="nav-links">

                </li>

                    <span data-i18n="menu.plugins"></span>
                </li>

                    <span data-i18n="menu.data"></span>
                </li>

            </ul>

            <div class="bottom-action">
                <button class="btn-primary" id="add-game-btn" data-i18n-title="menu.add_game" title="Thêm Game">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span class="sidebar-text-only" data-i18n="menu.add_game"></span>
                </button>
                <button class="btn-delete" id="exit-btn" data-i18n-title="menu.exit" title="Thoát ứng dụng">
                    <div class="exit-icon-wrap">
                        <svg class="exit-hex" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polygon points="12 2 22 7 22 17 12 22 2 17 2 7"></polygon>
                        </svg>
                        <svg class="exit-power" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                            <line x1="12" y1="2" x2="12" y2="12"></line>
                        </svg>
                    </div>
                    <span class="sidebar-text-only" data-i18n="menu.exit"></span>
                </button>
            </div>
        </nav>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!--  Main Content  -->
        <main class="content-area">

            <!-- Library View -->
            <section id="library-view" class="view-section active">
                <header>
                    <h1 data-i18n="library.title"></h1>
                    <p class="subtitle" data-i18n="library.subtitle"></p>
                </header>
                <div class="games-grid" id="games-container">
                    <!-- Cards injected by ATM.games -->
                </div>
            </section>

            <!-- Workspace View -->
            <section id="workspace-view" class="view-section hidden" style="height: 100%; flex-direction: column;">
                <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h1 id="workspace-title">Tên Game</h1>
                        <p class="subtitle" id="workspace-subtitle">Đang dịch - 45%</p>
                    </div>
                    <div>
                        <button class="btn-accent workspace-back-btn" id="workspace-back-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            <span data-i18n="workspace.back">Trở về Thư viện</span>
                        </button>
                    </div>
                </header>
                <div class="workspace-container" id="workspace-container" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border-color);">
                    <!-- Injected via workspace.js -->
                </div>
            </section>

            <!-- Plugins View -->
            <section id="marketplace-view" class="view-section hidden">
                <header>
                    <h1 data-i18n="plugins.title"></h1>
                    <p class="subtitle" data-i18n="plugins.subtitle"></p>
                </header>
                <div class="plugins-list">
                    <div class="plugin-card">
                        <div class="plugin-info">
                            <h3>Google Translate</h3>
                            <p data-i18n="plugins.google_desc"></p>
                            <span class="badge installed" data-i18n="plugins.installed"></span>
                        </div>
                    </div>
                    <div class="plugin-card" style="flex-direction:column;align-items:stretch;gap:12px;">
                        <div class="plugin-info" style="display:flex;flex-direction:column;width:100%;">
                            <h3 data-i18n="plugins.deepl"></h3>
                            <p data-i18n="plugins.deepl_desc" style="margin-bottom:8px;"></p>
                            <div><span class="badge installed" data-i18n="plugins.ready"></span></div>
                        </div>
                        <input type="password" id="deepl-api-key" placeholder=""
                               class="themed-input" data-i18n-placeholder="plugins.deepl_placeholder"
                               style="padding:10px;border-radius:6px;width:100%;">
                    </div>
                    <div class="plugin-card">
                        <div class="plugin-info">
                            <h3 data-i18n="plugins.libre"></h3>
                            <p data-i18n="plugins.libre_desc"></p>
                            <span class="badge" data-i18n="plugins.coming_soon"></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Data View -->
            <section id="data-view" class="view-section hidden">
                <header>
                    <h1 data-i18n="data.title" style="font-size:28px;font-weight:800;"></h1>
                    <p class="subtitle" data-i18n="data.subtitle"></p>
                </header>

                <div class="data-actions-bar">
                    <button class="btn-accent" id="data-open-folder-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        <span data-i18n="data.open_folder"></span>
                    </button>
                    <button class="btn-accent" id="data-refresh-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        <span data-i18n="data.refresh"></span>
                    </button>
                </div>

                <div class="data-grid">
                    <!-- Global Cache -->
                    <div class="data-card">
                        <div class="card-title" data-i18n="data.global_cache"></div>
                        <div class="card-desc" data-i18n="data.global_cache_desc"></div>
                        <div class="stat-row">
                            <span class="label" data-i18n="data.entries"></span>
                            <span class="value" id="stat-cache-count">0</span>
                        </div>
                        <div class="stat-row">
                            <span class="label" data-i18n="data.size"></span>
                            <span class="value" id="stat-cache-size">0 KB</span>
                        </div>
                        <div class="stat-actions">
                            <input type="number" id="cache-keep-count" value="5000"
                                   class="themed-input" style="width:100px;" title="Keep N entries">
                            <button class="btn-accent" id="data-keep-clear-btn" data-i18n="data.keep_clear"></button>
                            <button class="btn-delete" id="data-clear-all-cache-btn" data-i18n="data.clear_all"></button>
                        </div>
                    </div>

                    <!-- Global TM -->
                    <div class="data-card">
                        <div class="card-title" data-i18n="data.global_tm"></div>
                        <div class="card-desc" data-i18n="data.global_tm_desc"></div>
                        <div class="stat-row">
                            <span class="label" data-i18n="data.entries"></span>
                            <span class="value" id="stat-memory-count">0</span>
                        </div>
                        <div class="stat-row">
                            <span class="label" data-i18n="data.size"></span>
                            <span class="value" id="stat-memory-size">0 KB</span>
                        </div>
                        <div class="stat-actions">
                            <button class="btn-delete" id="data-clear-tm-btn" style="width:100%;" data-i18n="data.clear_all"></button>
                        </div>
                    </div>
                </div>

                <!-- Game Data -->
                <div class="card mt-20" style="padding:15px; border:1px solid var(--primary-color);">
                    <h3 data-i18n="data.game_data_title" style="margin-bottom: 15px;"></h3>
                    <div id="game-data-list" style="display: flex; flex-direction: column; gap: 10px;">
                    </div>
                </div>
            </section>

            <!-- Settings View -->
            <section id="settings-view" class="view-section hidden">
                <header>
                    <h1 data-i18n="settings.title"></h1>
                    <p class="subtitle" data-i18n="settings.subtitle"></p>
                </header>
                <div class="settings-card">
                    <div class="setting-item">
                        <div>
                            <h4 data-i18n="settings.dark_mode"></h4>
                            <p data-i18n="settings.dark_mode_desc"></p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="theme-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <div>
                            <h4 data-i18n="settings.accent_color"></h4>
                            <p data-i18n="settings.accent_color_desc"></p>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <input type="color" id="accent-color-picker" value="#7000ff"
                                   style="border:none;width:40px;height:40px;border-radius:8px;cursor:pointer;background:transparent;">
                            <button class="btn-icon" id="accent-reset-btn" title="Reset to default" style="padding:8px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                    <path d="M3 3v5h5"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <div>
                            <h4 data-i18n="settings.ui_lang"></h4>
                            <p data-i18n="settings.ui_lang_desc"></p>
                        </div>
                        <select id="ui-lang-select" class="lang-select" style="width:150px;">
                            <option value="vi">Vietnamese</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
                <div class="settings-card" style="margin-top:18px;">
                    <div class="setting-item">
                        <div>
                            <h4 data-i18n="settings.tm_threshold"></h4>
                            <p data-i18n="settings.tm_threshold_desc"></p>
                        </div>
                        <input id="tm-threshold" type="number" min="0.50" max="1" step="0.01" value="0.85"
                               class="themed-input" style="width:82px;padding:8px;">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!--  TEMPLATE: WORKSPACE EDITOR  -->
    <template id="workspace-editor-template">
        <div style="display:flex;flex-direction:column;height:100%;">
            <div style="margin-bottom:16px; display:flex; gap:8px; align-items:center; padding-right: 8px;">
                <input type="text" id="editor-search" class="themed-input" placeholder="" data-i18n-placeholder="editor.search_placeholder" style="flex:1;padding:8px; border-radius: var(--radius-sm);">
                <select id="editor-filter-type" class="lang-select">
                    <option value="all" data-i18n="editor.filter_all"></option>
                    <option value="qa_error" data-i18n="editor.filter_qa"></option>
                </select>
                <button class="btn-accent" id="editor-run-qa-btn" style="display: flex; align-items: center; gap: 6px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span data-i18n="editor.run_qa"></span>
                </button>
                <button class="btn-success heartbeat-neon-green hidden" id="editor-master-save-btn" style="position: relative; display: none; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; padding: 0;" title="Lưu thay đổi">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <span id="editor-master-save-text" style="position: absolute; top: -6px; right: -6px; background: var(--danger, #f43f5e); color: white; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 2px solid var(--bg-card);">0</span>
                </button>
                <button class="btn-delete heartbeat-neon-red hidden" id="editor-master-cancel-btn" style="display: none; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; padding: 0;" title="Hủy toàn bộ">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <!-- Header Cột -->
            <div style="display:flex; gap:16px; margin-bottom:8px; font-weight:600; padding:0 8px; color: var(--text-secondary); font-size: 13px; text-transform: uppercase;">
                <div style="flex:1;" data-i18n="editor.source_lang"></div>
                <div style="flex:1;" data-i18n="editor.target_lang"></div>
            </div>
            
            <!-- Danh sách (Split View) -->
            <div id="editor-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:var(--bg-hover);padding:12px;border-radius: var(--radius-md);">
                <!-- Rendered by editor.js -->
            </div>
            
            <!-- Phân trang -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
                <div style="color:var(--text-secondary);font-size:13px;" id="editor-stats" data-i18n="editor.stats"></div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn-secondary" id="editor-prev-page" disabled data-i18n="editor.prev_page"></button>
                    <span id="editor-page-label" style="font-size:14px;font-weight:600; min-width: 60px; text-align: center;">1 / 1</span>
                    <button class="btn-secondary" id="editor-next-page" disabled data-i18n="editor.next_page"></button>
                </div>
            </div>
        </div>
    </template>

    <!--  Modals  -->

    <!--  Glossary Modal  -->
    <div id="glossary-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="width:700px;max-width:95%;">
            <div class="modal-header">
                <h3 data-i18n="glossary.title"></h3>
                <button class="btn-close" id="glossary-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <p data-i18n="glossary.desc" style="color:var(--text-secondary);font-size:13px;margin:0;"></p>
                    <div style="display:flex; gap:8px;">
                        <input type="file" id="glossary-import-file" accept=".csv" style="display:none;">
                        <button class="btn-accent" id="glossary-import-btn" style="padding:4px 8px; font-size:12px;" data-i18n="glossary.import"></button>
                        <button class="btn-accent" id="glossary-export-btn" style="padding:4px 8px; font-size:12px;" data-i18n="glossary.export"></button>
                    </div>
                </div>
                
                <div id="glossary-list" style="max-height:300px;overflow-y:auto;margin-bottom:12px;background:var(--bg-hover);padding:8px;border-radius:8px;"></div>
                
                <div style="display:flex;gap:8px; align-items:center;">
                    <input type="text" id="glossary-source" class="themed-input" list="glossary-suggestions"
                           data-i18n-placeholder="glossary.source_placeholder"
                           placeholder="Original word" style="flex:1;padding:8px;border-radius:6px;">
                    <datalist id="glossary-suggestions"></datalist>
                    <span style="font-weight:bold;color:var(--text-muted);"></span>
                    <input type="text" id="glossary-target" class="themed-input"
                           data-i18n-placeholder="glossary.target_placeholder"
                           placeholder="Translation" style="flex:1;padding:8px;border-radius:6px;">
                    <button class="btn-accent" id="glossary-add-btn"
                            style="width:auto;padding:8px 16px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span data-i18n="btn.add"></span>
                    </button>
                </div>
            </div>
            <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;">
                <button class="btn-delete" id="glossary-modal-close-btn"
                        style="padding:8px 16px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    <span data-i18n="btn.close"></span>
                </button>
                <button class="btn-success" id="glossary-save-btn"
                        style="width:auto;padding:8px 16px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span data-i18n="btn.save"></span>
                </button>
            </div>
        </div>
    </div>

    <!--  Translation Memory Modal  -->
    <div id="translation-memory-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="width:700px;max-width:95%;">
            <div class="modal-header">
                <h3 data-i18n="tm.title"></h3>
                <button class="btn-close" id="tm-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-secondary);margin-bottom:12px;font-size:13px;">
                    <span data-i18n="tm.desc"></span>
                </p>
                <textarea id="tm-source-text" class="themed-input"
                          data-i18n-placeholder="tm.lookup_placeholder"
                          placeholder="Enter text to search..."
                          style="width:100%;min-height:80px;box-sizing:border-box;padding:8px;"></textarea>

                <div style="display:flex;gap:8px;margin:10px 0;align-items:center;">
                    <label for="tm-category" data-i18n="tm.category"></label>
                    <select id="tm-category" class="lang-select" style="width:160px;">
                        <option value="dialogue">dialogue</option>
                        <option value="ui">ui</option>
                        <option value="item">item</option>
                        <option value="skill">skill</option>
                        <option value="actor_name">actor name</option>
                        <option value="system">system</option>
                        <option value="unknown" selected>unknown</option>
                    </select>
                    <button class="btn-accent" id="tm-find-btn"
                            style="width:auto;padding:8px 16px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span data-i18n="tm.find_btn"></span>
                    </button>
                </div>
                <div id="tm-suggestions" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;"></div>
            </div>
        </div>
    </div>

    <!--  Confirm Modal  -->
    </body>
</html>
