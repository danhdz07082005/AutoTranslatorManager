name: Build and Release

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag phiên bản (vd: v2.0.0)
  release:
    types: [published] # Kích hoạt khi bấm tạo/xuất bản Release trên web GitHub
  workflow_dispatch: # Kích hoạt bằng nút bấm "Run workflow" thủ công trên GitHub Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --name AutoTranslator --onefile --windowed --add-data "atm/ui/web;atm/ui/web" --add-data "atm/resources;atm/resources" run_app.py

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AutoTranslator.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoTranslator-Windows-x64
        path: dist/AutoTranslator.exe


